{{define "search"}}
<article class="node">
<header class="node-head">
  <h1>Search</h1>
  <p class="lead">Search the pages of the site and the names of the Lean code.</p>
</header>
<form class="search-box big" action="" role="search" onsubmit="return false">
  <input id="q" type="search" name="q" placeholder="For example: overview, trust, theta" aria-label="Search" autocomplete="off" autofocus>
</form>
<p id="search-status" class="muted" role="status">The search needs JavaScript. Without it, use the menu.</p>
<ul id="results" class="results"></ul>
<h2 class="results-head">Lean names</h2>
<ul id="lean-results" class="results" aria-live="polite"></ul>
</article>
{{end}}
